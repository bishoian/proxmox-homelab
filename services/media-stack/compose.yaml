# Media services for the Debian VM.
# Application configuration stays on the VM's NVMe-backed system disk.
# Media and download data stays on the Seagate filesystem mounted at /srv/media.
#
# All download-management containers use /data as the same in-container path.
# This keeps downloads and final libraries on one filesystem for hardlink support.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    environment:
      TZ: America/Chicago
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - ./config/jellyfin:/config
      - ./cache/jellyfin:/cache
      - type: bind
        source: /srv/media/data/media
        target: /media
        read_only: true
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      UMASK: "002"
    ports:
      - "7878:7878/tcp"
    volumes:
      - ./config/radarr:/config
      - /srv/media/data:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      UMASK: "002"
    ports:
      - "8989:8989/tcp"
    volumes:
      - ./config/sonarr:/config
      - /srv/media/data:/data
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      UMASK: "002"
    ports:
      - "9696:9696/tcp"
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      TZ: America/Chicago
      FIREWALL_INPUT_PORTS: "8080"
    ports:
      - "8080:8080/tcp"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      UMASK: "002"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./config/qbittorrent:/config
      - /srv/media/data:/data
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      TZ: America/Chicago
      PORT: "5055"
    ports:
      - "5055:5055/tcp"
    volumes:
      - ./config/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0
    container_name: mealie
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      ALLOW_SIGNUP: "false"
      DEFAULT_GROUP: "Home"
      DEFAULT_HOUSEHOLD: "Family"
    ports:
      - "9925:9000/tcp"
    volumes:
      - ./config/mealie:/app/data
    deploy:
      resources:
        limits:
          memory: 1000M
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    user: "1000:1000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      TZ: America/Chicago
    ports:
      - "13378:80/tcp"
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - /srv/media/data/audiobooks:/audiobooks
      - /srv/media/data/podcasts:/podcasts
    restart: unless-stopped
